[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdpt-core"
version = "0.1.0"
description = "Pickup and delivery with time windows and capacitated transfer points: verifier, max-plus LNS, exact models, PORT generator."
authors = [{name = "The pdpt-core authors"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy", "numba", "highspy", "ortools", "scipy"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pdpt", "pdpt.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
